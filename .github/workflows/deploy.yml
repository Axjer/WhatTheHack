name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 每日更新（惡意網址清單、新聞、KEV 統計）由 cron-job.org 在台灣時間 06:07 呼叫 GitHub API 觸發 workflow_dispatch，
  # 設定與 token 更新方式見 docs/daily-update.md。
  # GitHub 排程留作備援：它在這個 repo 常延遲約 6 小時，偶爾會被丟掉，所以不當主要觸發方式。
  # 多跑一次沒有壞處（已有摘要的新聞會沿用）。實際執行時間不保證，所以頁面只寫「每日更新」。
  schedule:
    - cron: '7 22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 外部來源或 Gemini 卡住時不要空跑到預設的 6 小時上限
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v5
      # 抓取 URLhaus 與 OpenPhish；任一來源失敗時沿用目前已部署的清單，不會中斷部署
      - run: npm run update-list
        env:
          URLHAUS_AUTH_KEY: ${{ secrets.URLHAUS_AUTH_KEY }}
          PREVIOUS_LIST_URL: ${{ steps.pages.outputs.base_url }}/data/malicious-urls.json
      # 抓 The Hacker News 並用 Gemini 3.5 Flash-Lite 產生白話摘要；沒有 API key 或失敗時沿用目前已部署的摘要
      - run: npm run update-news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PREVIOUS_NEWS_URL: ${{ steps.pages.outputs.base_url }}/data/news.json
      # 抓 CISA 已被利用漏洞清單，統計近 7 天每天的新增筆數；抓不到時第一天沿用已部署的統計，隔天改抓 GitHub 官方副本
      - run: npm run update-kev
        env:
          PREVIOUS_KEV_URL: ${{ steps.pages.outputs.base_url }}/data/kev.json
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
