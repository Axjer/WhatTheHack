name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 每天 00:00 UTC（台灣時間 08:00）更新惡意網址清單並重新部署
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v5
      # 抓取 URLhaus 與 OpenPhish；任一來源失敗時沿用目前已部署的清單，不會中斷部署
      - run: npm run update-list
        env:
          URLHAUS_AUTH_KEY: ${{ secrets.URLHAUS_AUTH_KEY }}
          PREVIOUS_LIST_URL: ${{ steps.pages.outputs.base_url }}/data/malicious-urls.json
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
